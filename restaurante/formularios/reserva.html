<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Cristina Corina Tnasie">
    <meta name="description" content="Formulario de reserva de mesa para el restaurante">
    <meta name="keywords" content="restaurante, reserva, mesa, formulario, contacto">
    <title>Haz una reserva</title>
</head>
    <nav>
        <a href="../../index.html">Volver a la página principal</a>
    </nav>
<body>

    <h1>Haz una reserva</h1>

    <form action="#" method="post">

        <!-- Fila 1 -->
        <input type="text" name="nombre" placeholder="Su nombre" style="width: 300px;">

        <input type="number" name="clientes" placeholder="Número de clientes" style="width: 300px;">
        <br><br>

        <!-- Fila 2 -->
        <input type="email" name="email" placeholder="Su correo electrónico" style="width: 300px;">

        <input type="tel" name="telefono" placeholder="su teléfono" style="width: 300px;">
        <br><br>

        <!-- Fila 3 -->
        <input type="date" name="fecha" placeholder="Fecha de la reserva" style="width: 300px;">

        <input type="time" name="hora" placeholder="Hora de la reserva" style="width: 300px;">
        <br><br>

        <!-- Fila 4 -->
        <input type="text" name="mensaje" placeholder="Su mensaje" style="width: 635px;">
        <br><br>

        <!-- Botón de envío -->
        <input type="submit" value="SOLICITAR RESERVA">
        <br><br>

        <!-- Política de privacidad -->
        <p><small>Si desea saber cómo protegemos sus datos, consulte nuestra <a href="#">Política de privacidad</a></small></p>

    </form>

</body>

</html>
