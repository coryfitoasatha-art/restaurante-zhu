<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Cristina Corina Tnasie">
    <meta name="description" content="Formulario de contacto del restaurante">
    <meta name="keywords" content="restaurante, contacto, mensaje, formulario">
    <title>Envíenos su mensaje</title>
</head>
    <nav>
        <a href="../../index.html">Volver a la página principal</a>
    </nav>
<body>

    <h1>Envíenos su mensaje</h1>

    <form action="#" method="post">

        <!-- Fila 1: Nombre, Correo y Teléfono -->
        <input type="text" name="nombre" placeholder="Su nombre" style="width: 200px;">

        <input type="email" name="email" placeholder="Su correo electrónico" style="width: 200px;">

        <input type="tel" name="telefono" placeholder="su teléfono" style="width: 200px;">
        <br><br>

        <!-- Fila 2: Asunto -->
        <input type="text" name="asunto" placeholder="Asunto" style="width: 635px;">
        <br><br>

        <!-- Fila 3: Mensaje y contador -->
        <textarea name="mensaje" placeholder="Su mensaje" rows="8" cols="75" maxlength="500"></textarea>
        <br>
        <small>0 / 500</small>
        <br><br>

        <!-- Botón de envío -->
        <input type="submit" value="ENVIAR">

    </form>

</body>

</html>
